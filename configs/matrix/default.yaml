experiment:
  name: gcn-oversmoothing-threshold
  seed_list: [0, 1, 2, 3, 4]

data:
  type: synthetic
  num_communities_list: [2, 4, 8, 16]
  nodes_per_community: 100
  feature_dim: 16
  edge_prob_intra: 0.08
  edge_prob_inter: 0.01

model:
  type: gcn
  hidden_dim: 64
  num_layers_list: [1, 2, 3, 4, 5, 6, 7, 8]
  dropout: 0.5

train:
  epochs: 200
  learning_rate: 0.01
  weight_decay: 0.0005
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

eval:
  metrics: [accuracy]
  aux_metrics: [mean_pairwise_cosine_similarity]

output:
  dir: outputs/
  save_weights: false